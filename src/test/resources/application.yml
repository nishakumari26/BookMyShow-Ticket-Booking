spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:bookmyshowtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-chars
    expiration-ms: 3600000
  seed-data: false
  mail:
    enabled: false
    from: test@bookmyshow.local
