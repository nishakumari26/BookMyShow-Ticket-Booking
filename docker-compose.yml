services:
  mysql:
    image: mysql:8.0
    container_name: bookmyshow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-bookmyshow}
      MYSQL_USER: ${DB_USERNAME:-bookmyshow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bookmyshow-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLISH_PORT:-18080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bookmyshow}
      DB_USERNAME: ${DB_USERNAME:-bookmyshow}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:13000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:13000}

  frontend:
    build: ./frontend
    container_name: bookmyshow-frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PUBLISH_PORT:-13000}:80"

volumes:
  mysql_data:
